version: "3.1"

# ---------------------------------------------------------------------------
# Règles : dialogue déterministe minimal.
# Rasa gère seulement les politesses ; toute autre question part au RAG.
# ---------------------------------------------------------------------------

rules:

- rule: Saluer l'utilisateur
  steps:
  - intent: saluer
  - action: utter_saluer

- rule: Dire au revoir
  steps:
  - intent: au_revoir
  - action: utter_au_revoir

- rule: Répondre aux remerciements
  steps:
  - intent: remercier
  - action: utter_remercier

# Question métier reconnue → assistance documentaire (RAG)
- rule: Question documentaire vers le RAG
  steps:
  - intent: question_documentaire
  - action: action_rag_fallback

# Phrase inconnue (confiance sous le seuil) → RAG aussi (filet de sécurité)
- rule: Fallback vers le RAG
  steps:
  - intent: nlu_fallback
  - action: action_rag_fallback
