version: "3.1"

# ---------------------------------------------------------------------------
# Données d'entraînement NLU (français).
# 3 intentions de politesse + une intention « panier » (question_documentaire)
# qui capte les questions métier et les route vers le RAG. Les phrases
# vraiment inconnues tombent sous le seuil → nlu_fallback → RAG aussi.
# Pourquoi le panier ? Un softmax répartit 100 % de sa confiance entre les
# classes connues : sans panier, une question métier peut être classée
# « politesse » avec une confiance élevée (constaté : 0,94 sur remercier).
# ---------------------------------------------------------------------------

nlu:
- intent: saluer
  examples: |
    - bonjour
    - salut
    - bonsoir
    - hello
    - salam
    - coucou
    - bonjour, j'ai besoin d'aide
    - salut, vous pouvez m'aider ?
    - bonjour madame
    - bonjour monsieur

- intent: au_revoir
  examples: |
    - au revoir
    - à bientôt
    - bonne journée
    - bye
    - c'est tout merci
    - je n'ai plus besoin d'aide
    - à plus tard
    - bonne soirée

- intent: remercier
  examples: |
    - merci
    - merci beaucoup
    - c'est gentil merci
    - parfait merci
    - super, merci
    - merci pour votre aide
    - top merci

- intent: question_documentaire
  examples: |
    - comment payer ma facture ?
    - je veux payer ma facture
    - où régler ma facture ?
    - est-ce que je peux payer en ligne ?
    - comment consulter ma consommation ?
    - je veux comprendre ma facture
    - comment souscrire un abonnement ?
    - je veux un branchement d'eau
    - comment résilier mon contrat ?
    - il y a une fuite d'eau dans ma rue
    - que faire en cas de coupure d'électricité ?
    - je n'ai plus d'eau à la maison
    - où se trouvent vos agences ?
    - quels sont vos horaires d'ouverture ?
    - comment contacter le service client ?
    - qui est Amendis ?
    - quelles sont les actualités d'Amendis ?
    - quels sont les tarifs de l'eau ?
    - comment faire une réclamation ?
    - comment déplacer mon compteur ?
    # Affirmations / réponses aux suggestions du bot : elles doivent partir
    # au RAG (qui a la mémoire de la conversation), pas être prises pour
    # des politesses.
    - oui
    - oui s'il vous plaît
    - oui je veux bien
    - oui je veux savoir les deux
    - oui pour les deux
    - je veux les deux
    - d'accord
    - ok vas-y
    - oui montre-moi
    - bien sûr
    - pourquoi pas
    - dis-moi en plus

- intent: incompris
  # Charabia / saisie au clavier sans signification : ne doit PAS être pris
  # pour une politesse. Déclenche une demande de reformulation (rules.yml).
  examples: |
    - asdf
    - asdnsabdi
    - dbqibdqbd
    - dheiwqhdiqe
    - qwerty
    - azerty
    - hjklm
    - xxxxxx
    - aaaaaaa
    - zzzzzz
    - mdslkfj
    - qsdfghj
    - wxcvbn
    - iuytre
    - lkjhgf
    - ncbvhd
    - poiuyt
    - fjdksla
    - blablabla
    - jsp jsp jsp
    - ????
    - .....
    - iam
    - asd
    - jkl
    - aze
    - qsd
    - wxc
    - hjk
    - dfg
    - uio
    - zer
