version: "3.1"

# ---------------------------------------------------------------------------
# Domaine du chatbot Amendis : intentions, réponses, actions.
# Architecture 100 % documentaire : Rasa gère seulement les politesses ;
# toute autre question passe sous le seuil de confiance → nlu_fallback → RAG.
# ---------------------------------------------------------------------------

intents:
  - saluer
  - au_revoir
  - remercier
  - question_documentaire  # intention « panier » : toute question Amendis → RAG
  - nlu_fallback           # confiance faible (phrase inconnue) → RAG aussi

responses:
  utter_saluer:
    - text: >-
        Bonjour ! 👋 Je suis l'assistant virtuel d'Amendis.
        Je réponds à vos questions à partir des informations officielles
        du site amendis.ma. Vous pouvez par exemple m'interroger sur :
        • le paiement de vos factures
        • l'abonnement ou le branchement (eau, électricité)
        • une fuite d'eau ou une coupure
        • nos agences et moyens de contact
        Comment puis-je vous aider ?

  utter_au_revoir:
    - text: "Merci d'avoir utilisé l'assistance Amendis. À bientôt ! 👋"

  utter_remercier:
    - text: "Je vous en prie ! Puis-je vous aider pour autre chose ?"

  
actions:
  - action_rag_fallback


session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
